[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymail-client"
version = "0.1.0"
description = "Desktop email client focused on privacy, sanitized reading and headers-first IMAP sync"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "nh3>=0.2",
    "tinycss2>=1.2",
    "html5lib>=1.1",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["pymail_client*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `docs/` contém a spec normativa e o plano de implementação: são artefatos de
# referência, não código do projeto, e o formatador não deve reescrever os
# blocos de exemplo nem os comentários que os explicam.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Os testes são transcritos literalmente do plano de implementação; a ordem de
# imports e o alinhamento dos comentários são do plano, não do estilo do projeto.
"tests/test_config.py" = ["I001"]

[tool.ruff.format]
exclude = ["tests/test_config.py"]

[tool.mypy]
python_version = "3.11"
packages = ["pymail_client"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requer servidor real (Docker); pulado quando indisponível",
    "slow: execução longa; excluído do ciclo curto",
]
